  $('home').hidden=true;$('test').hidden=false;$('res').hidden=true;
  $('finish').hidden=false;$('again').hidden=true;$('toHome').hidden=true;$('timer').hidden=false;
  t0=Date.now();tick();clearInterval(timer);timer=setInterval(tick,1000);
  window.scrollTo(0,0);
}

function finish(){
  clearInterval(timer);
  var score=0;
  items.forEach(function(it){
    it.ls.forEach(function(x){
      x.r.disabled=true;
      var tag=null;
      if(x.ok){x.l.classList.add('ok');tag='✓ правильно';if(x.r.checked)score++}
      else if(x.r.checked){x.l.classList.add('bad');tag='✗ ваша відповідь'}
      if(tag)x.l.appendChild(el('span',tag,'tag'));
    });
    it.e.hidden=false;
  });
  var r=$('res');r.innerHTML='';
  r.appendChild(el('h2','Результат: '+score+' з '+items.length));
  r.appendChild(el('p','Час: '+$('timer').textContent+'. Завдання без відповіді враховуються як неправильні. Перегляньте пояснення під кожним завданням.'));
  r.hidden=false;$('finish').hidden=true;$('again').hidden=false;$('toHome').hidden=false;
  r.scrollIntoView();r.focus();
}

$('finish').onclick=finish;
$('again').onclick=function(){start(cur.tp,cur.n)};
$('toHome').onclick=home;
$('back').onclick=home;
home();
})();
</script>
</body>
